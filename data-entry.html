<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدخال البيانات</title><link rel="stylesheet" href="style.css"><style id="globalDrawerStyle">
.menu-toggle{position:fixed;top:22px;left:22px;z-index:30;width:54px;height:54px;border:1px solid #dce3ec;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(16,43,85,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}.menu-toggle span{display:block;width:24px;height:3px;border-radius:4px;background:#102b55}.drawer{position:fixed;top:0;right:-330px;width:310px;height:100vh;z-index:29;background:#103746;color:#fff;padding:92px 22px 30px;box-shadow:-15px 0 40px rgba(0,0,0,.18);transition:.28s ease}.drawer.open{right:0}.drawer h2{font-size:22px;margin:0 0 4px;color:#fff}.drawer small{color:#a9d2df}.drawer nav{margin-top:30px}.drawer a{display:block;color:#fff;text-decoration:none;padding:13px 15px;border-radius:12px;margin:5px 0;font-weight:700}.drawer a:hover,.drawer a.active{background:#1c5b70}.drawer-overlay{position:fixed;inset:0;background:rgba(15,30,60,.22);z-index:28;display:none}.drawer-overlay.show{display:block}@media(max-width:600px){.drawer{width:min(310px,88vw)}.menu-toggle{top:14px;left:14px}}
</style></head><body><button class="menu-toggle" aria-label="القائمة" onclick="toggleGlobalMenu()"><span></span><span></span><span></span></button><div class="drawer-overlay" id="drawerOverlay" onclick="toggleGlobalMenu(false)"></div><aside class="drawer" id="globalDrawer"><h2>مجمع الدكتور مهند الطبي</h2><small>Medical Management System — BETA</small><nav><a href="dashboard.html" class="">النظرة المالية</a><a href="data-entry.html" class="active">إدخال البيانات</a><a href="doctors.html" class="">الأطباء والأقسام</a><a href="income.html" class="">الإيرادات</a><a href="expenses.html" class="">المصروفات</a><a href="reports.html" class="">التقارير والتحليل</a><a href="index.html">تسجيل الخروج</a></nav></aside><div class="app" style="display:block"><main class="main"><div class="top"><div><h2>إدخال البيانات</h2><span class="muted">بيانات الأطباء والشفتات في النسخة الحالية تجريبية.</span></div><span class="badge">BETA / DEMO</span></div><div class="card"><div class="form"><div class="field"><label>نوع العملية</label><select><option>إيراد</option><option>صرف</option></select></div><div class="field"><label>التاريخ</label><input type="date"></div><div class="field"><label>القسم / العيادة</label><select><option>الأسنان</option><option>العيادات العامة</option><option>النساء والولادة</option><option>البشرة والجلدية</option><option>الليزر والتجميل</option><option>الفيلر والبوتوكس</option><option>الإبر والنضارة</option><option>الطوارئ</option><option>المختبرات</option><option>الأشعة</option></select></div><div class="field"><label>الطبيب / المختص</label><select id="doctor" onchange="doctorChange()"><option data-salary="12000">د. أحمد السلمي — الأسنان</option><option data-salary="13500">د. نورة الحربي — الأسنان</option><option data-salary="11000">د. خالد العتيبي — العيادات العامة</option><option data-salary="11500">د. ريم الزهراني — العيادات العامة</option><option data-salary="15000">د. سارة القرشي — النساء والولادة</option><option data-salary="15500">د. هناء العمري — النساء والولادة</option><option data-salary="14000">د. سامي الغامدي — البشرة والجلدية</option><option data-salary="14500">د. لمى الشريف — الليزر والتجميل</option><option data-salary="15000">د. مها المطيري — الفيلر والبوتوكس</option><option data-salary="13000">د. جود القحطاني — الإبر والنضارة</option><option data-salary="14000">د. فهد المالكي — الطوارئ</option><option data-salary="14000">د. وليد الحربي — الطوارئ</option><option data-salary="8500">أ. ليان أحمد — المختبرات</option><option data-salary="9500">أ. فيصل محمد — الأشعة</option></select></div><div class="field"><label>راتب الطبيب</label><input id="salary" value="12000" readonly></div><div class="field"><label>الشفت</label><select><option>صباح</option><option>مساء</option><option>صباح ومساء</option></select></div><div class="field"><label>من</label><input type="time"></div><div class="field"><label>إلى</label><input type="time"></div><div class="field"><label>عدد المرضى</label><input type="number" value="1" min="1"></div><div class="field"><label>إيراد المريض</label><input id="gross" type="number" value="600" oninput="calc()"></div><div class="field"><label>ضريبة القيمة المضافة</label><input value="15%" readonly></div><div class="field"><label>نسبة إضافية %</label><input id="extra" type="number" value="0" oninput="calc()"></div><div class="field"><label>الصافي</label><input id="net" readonly></div><div class="field wide"><label>ملاحظات</label><input placeholder="ملاحظات اختيارية"></div><div class="wide"><button class="btn" onclick="saveEntry()">حفظ وترحيل تلقائي</button></div></div></div></main></div><script src="app.js"></script><script>function doctorChange(){let o=document.getElementById('doctor').selectedOptions[0];document.getElementById('salary').value=o.dataset.salary||''}doctorChange()</script><script>function toggleGlobalMenu(force){const d=document.getElementById('globalDrawer'),o=document.getElementById('drawerOverlay');const open=typeof force==='boolean'?force:!d.classList.contains('open');d.classList.toggle('open',open);o.classList.toggle('show',open)}</script></body></html>
