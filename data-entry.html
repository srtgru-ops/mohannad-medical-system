<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدخال البيانات</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="side"><div class="brand">مجمع الدكتور مهند الطبي<small>Medical Management System — BETA</small></div><nav class="nav"><a href="dashboard.html" class="">النظرة المالية</a><a href="data-entry.html" class="active">إدخال البيانات</a><a href="doctors.html" class="">الأطباء والأقسام</a><a href="income.html" class="">الإيرادات</a><a href="expenses.html" class="">المصروفات</a><a href="reports.html" class="">التقارير والتحليل</a><a href="index.html">تسجيل الخروج</a></nav></aside><main class="main"><div class="top"><div><h2>إدخال البيانات</h2><span class="muted">بيانات الأطباء والشفتات في النسخة الحالية تجريبية.</span></div><span class="badge">BETA / DEMO</span></div><div class="card"><div class="form"><div class="field"><label>نوع العملية</label><select><option>إيراد</option><option>صرف</option></select></div><div class="field"><label>التاريخ</label><input type="date"></div><div class="field"><label>القسم / العيادة</label><select><option>الأسنان</option><option>العيادات العامة</option><option>النساء والولادة</option><option>البشرة والجلدية</option><option>الليزر والتجميل</option><option>الفيلر والبوتوكس</option><option>الإبر والنضارة</option><option>الطوارئ</option><option>المختبرات</option><option>الأشعة</option></select></div><div class="field"><label>الطبيب / المختص</label><select id="doctor" onchange="doctorChange()"><option data-salary="12000">د. أحمد السلمي — الأسنان</option><option data-salary="13500">د. نورة الحربي — الأسنان</option><option data-salary="11000">د. خالد العتيبي — العيادات العامة</option><option data-salary="11500">د. ريم الزهراني — العيادات العامة</option><option data-salary="15000">د. سارة القرشي — النساء والولادة</option><option data-salary="15500">د. هناء العمري — النساء والولادة</option><option data-salary="14000">د. سامي الغامدي — البشرة والجلدية</option><option data-salary="14500">د. لمى الشريف — الليزر والتجميل</option><option data-salary="15000">د. مها المطيري — الفيلر والبوتوكس</option><option data-salary="13000">د. جود القحطاني — الإبر والنضارة</option><option data-salary="14000">د. فهد المالكي — الطوارئ</option><option data-salary="14000">د. وليد الحربي — الطوارئ</option><option data-salary="8500">أ. ليان أحمد — المختبرات</option><option data-salary="9500">أ. فيصل محمد — الأشعة</option></select></div><div class="field"><label>راتب الطبيب</label><input id="salary" value="12000" readonly></div><div class="field"><label>الشفت</label><select><option>صباح</option><option>مساء</option><option>صباح ومساء</option></select></div><div class="field"><label>من</label><input type="time"></div><div class="field"><label>إلى</label><input type="time"></div><div class="field"><label>عدد المرضى</label><input type="number" value="1" min="1"></div><div class="field"><label>إيراد المريض</label><input id="gross" type="number" value="600" oninput="calc()"></div><div class="field"><label>ضريبة القيمة المضافة</label><input value="15%" readonly></div><div class="field"><label>نسبة إضافية %</label><input id="extra" type="number" value="0" oninput="calc()"></div><div class="field"><label>الصافي</label><input id="net" readonly></div><div class="field wide"><label>ملاحظات</label><input placeholder="ملاحظات اختيارية"></div><div class="wide"><button class="btn" onclick="saveEntry()">حفظ وترحيل تلقائي</button></div></div></div></main></div><script src="app.js"></script><script>function doctorChange(){let o=document.getElementById('doctor').selectedOptions[0];document.getElementById('salary').value=o.dataset.salary||''}doctorChange()</script></body></html>
