<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | مجمع الدكتور مهند الطبي</title><link rel="stylesheet" href="style.css"></head><body><div class="login"><div class="loginbox"><h2>مجمع الدكتور مهند الطبي</h2><p class="muted">نظام الإدارة والتحليل المالي — BETA</p><form id="login-form"><input id="username" placeholder="اسم المستخدم" value="مدير النظام" autocomplete="username"><input id="login-password" type="password" placeholder="كلمة المرور" autocomplete="current-password" required><select id="role"><option>مدير</option><option>موظف إدخال</option></select><p id="login-error" style="color:#b52f39;min-height:22px" role="alert"></p><button type="submit" class="btn" style="width:100%;margin-top:8px">تسجيل الدخول</button></form></div></div><script>document.getElementById('login-form').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('login-password').value!=='مهند_الطبي@2026'){document.getElementById('login-error').textContent='كلمة المرور غير صحيحة';return;}try{sessionStorage.setItem('mohannad_staff_access_v1','ok')}catch(e){}location.href=document.getElementById('role').value==='مدير'?'dashboard.html':'data-entry.html';});</script></body></html>
