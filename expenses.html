<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصروفات</title><link rel="stylesheet" href="style.css"><style>.menu-toggle{position:fixed;top:22px;left:22px;z-index:30;width:54px;height:54px;border:1px solid #dce3ec;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(16,43,85,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}.menu-toggle span{width:24px;height:3px;border-radius:4px;background:#102b55}.drawer{position:fixed;top:0;right:-330px;width:310px;height:100vh;z-index:29;background:#103746;color:#fff;padding:92px 22px 30px;box-shadow:-15px 0 40px rgba(0,0,0,.18);transition:.28s}.drawer.open{right:0}.drawer h2{color:#fff}.drawer small{color:#a9d2df}.drawer nav{margin-top:30px}.drawer a{display:block;color:#fff;text-decoration:none;padding:13px 15px;border-radius:12px;margin:5px 0;font-weight:700}.drawer a:hover,.drawer a.active{background:#1c5b70}.drawer-overlay{position:fixed;inset:0;background:#0f1e3c38;z-index:28;display:none}.drawer-overlay.show{display:block}.filters{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:12px;margin-bottom:16px}.filters label{font-weight:700;color:#102b55}.filters select{width:100%;margin-top:7px;padding:12px;border:1px solid #dce3ec;border-radius:12px;background:#fff}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}.summary .card{padding:18px}.summary b{display:block;font-size:23px;margin-top:7px}.table-wrap{overflow:auto}@media(max-width:700px){.filters,.summary{grid-template-columns:1fr}.menu-toggle{top:14px;left:14px}.drawer{width:min(310px,88vw)}}</style></head><body><button class="menu-toggle" aria-label="القائمة" onclick="toggleGlobalMenu()"><span></span><span></span><span></span></button><div class="drawer-overlay" id="drawerOverlay" onclick="toggleGlobalMenu(false)"></div><aside class="drawer" id="globalDrawer"><h2>مجمع الدكتور مهند الطبي</h2><small>Medical Management System — BETA</small><nav><a href="dashboard.html">النظرة المالية</a><a href="data-entry.html">إدخال البيانات</a><a href="doctors.html">الأطباء والأقسام</a><a href="income.html">الإيرادات</a><a href="expenses.html" class="active">المصروفات</a><a href="reports.html">التقارير والتحليل</a><a href="index.html">تسجيل الخروج</a></nav></aside><div class="app" style="display:block"><main class="main"><div class="top"><h2>المصروفات</h2><button class="btn" onclick="exportFiltered()">تصدير Excel</button></div><div class="card filters"><label>الشهر<select id="month" onchange="applyFilters()"><option value="">كل الأشهر</option><option value="2026-09">سبتمبر 2026</option><option value="2026-08">أغسطس 2026</option></select></label><label>القسم<select id="department" onchange="departmentChanged()"><option value="">كل الأقسام</option></select></label><label>الطبيب<select id="doctor" onchange="applyFilters()"><option value="">كل الأطباء</option></select></label></div><div class="summary"><div class="card">إجمالي المصروفات<b id="total">0 ر.س</b></div><div class="card">عدد السجلات<b id="count">0</b></div></div><div class="card table-wrap"><table id="t" class="table"><thead><tr><th>التاريخ</th><th>القسم</th><th>الطبيب</th><th>النوع</th><th>القيمة</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="app.js"></script><script>const data=[['2026-09-28','الأسنان','د. أحمد','ضريبة/خصم',78.26],['2026-09-27','الأسنان','د. سارة','مستلزمات',110],['2026-09-26','البشرة والليزر','د. ريم','مستلزمات',180],['2026-09-25','النساء والولادة','د. نورة','ضريبة/خصم',123.91],['2026-08-28','الأسنان','د. أحمد','مستلزمات',95],['2026-08-22','المختبر','د. خالد','مستلزمات',70]];let filtered=[];const dep=document.getElementById('department'),doc=document.getElementById('doctor');[...new Set(data.map(x=>x[1]))].forEach(x=>dep.add(new Option(x,x)));function departmentChanged(){const d=dep.value;doc.innerHTML='<option value="">كل الأطباء</option>';[...new Set(data.filter(x=>!d||x[1]===d).map(x=>x[2]))].forEach(x=>doc.add(new Option(x,x)));applyFilters()}function applyFilters(){const m=document.getElementById('month').value,d=dep.value,p=doc.value;filtered=data.filter(x=>(!m||x[0].startsWith(m))&&(!d||x[1]===d)&&(!p||x[2]===p));document.getElementById('rows').innerHTML=filtered.map(x=>`<tr>${x.map((v,i)=>`<td>${i===4?Number(v).toLocaleString('ar-SA',{maximumFractionDigits:2})+' ر.س':v}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="5">لا توجد بيانات مطابقة</td></tr>';document.getElementById('total').textContent=filtered.reduce((s,x)=>s+x[4],0).toLocaleString('ar-SA',{maximumFractionDigits:2})+' ر.س';document.getElementById('count').textContent=filtered.length}function exportFiltered(){if(!filtered.length)return alert('لا توجد بيانات للتصدير');const headers=['التاريخ','القسم','الطبيب','النوع','القيمة'];const csv='\ufeff'+[headers,...filtered].map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='المصروفات-المفلترة.csv';a.click();URL.revokeObjectURL(a.href)}function toggleGlobalMenu(force){const d=document.getElementById('globalDrawer'),o=document.getElementById('drawerOverlay');const open=typeof force==='boolean'?force:!d.classList.contains('open');d.classList.toggle('open',open);o.classList.toggle('show',open)}departmentChanged();</script></body></html>
