<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإيرادات</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><style>.menu-toggle{position:fixed;top:22px;left:22px;z-index:30;width:54px;height:54px;border:1px solid #dce3ec;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(16,43,85,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}.menu-toggle span{width:24px;height:3px;background:#102b55}.drawer{position:fixed;top:0;right:-330px;width:310px;height:100vh;z-index:29;background:#103746;color:#fff;padding:92px 22px 30px;transition:.28s}.drawer.open{right:0}.drawer h2{color:#fff}.drawer nav{margin-top:30px}.drawer a{display:block;color:#fff;text-decoration:none;padding:13px 15px;border-radius:12px;margin:5px 0;font-weight:700}.drawer a:hover,.drawer a.active{background:#1c5b70}.drawer-overlay{position:fixed;inset:0;background:#0f1e3c38;z-index:28;display:none}.drawer-overlay.show{display:block}.filters{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:12px;margin-bottom:16px}.filters label{font-weight:700}.filters select{width:100%;margin-top:7px;padding:12px;border:1px solid #dce3ec;border-radius:12px;background:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.summary b{display:block;font-size:23px;margin-top:7px}.table-wrap{overflow:auto}.status{font-weight:700;margin-bottom:12px}@media(max-width:700px){.filters,.summary{grid-template-columns:1fr}}</style></head><body><button class="menu-toggle" onclick="toggleGlobalMenu()"><span></span><span></span><span></span></button><div class="drawer-overlay" id="drawerOverlay" onclick="toggleGlobalMenu(false)"></div><aside class="drawer" id="globalDrawer"><h2>مجمع الدكتور مهند الطبي</h2><nav><a href="dashboard.html">النظرة المالية</a><a href="data-entry.html">إدخال البيانات</a><a href="doctors.html">الأطباء والأقسام</a><a href="income.html" class="active">الإيرادات</a><a href="expenses.html">المصروفات</a><a href="inventory.html">إدارة المخزون</a><a href="reports.html">التقارير والتحليل</a></nav></aside><div class="app" style="display:block"><main class="main"><div class="top"><h2>الإيرادات</h2><button class="btn" id="exportBtn">تصدير Excel</button></div><div id="status" class="status">جاري تحميل البيانات من Firebase...</div><div class="card filters"><label>الشهر<select id="month"><option value="">كل الأشهر</option></select></label><label>القسم<select id="department"><option value="">كل الأقسام</option></select></label><label>الطبيب<select id="doctor"><option value="">كل الأطباء</option></select></label></div><div class="summary"><div class="card">إجمالي الإيرادات<b id="totalGross">0 ر.س</b></div><div class="card">صافي الإيرادات<b id="totalNet">0 ر.س</b></div><div class="card">عدد السجلات<b id="count">0</b></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>القسم</th><th>الطبيب</th><th>عدد المرضى</th><th>الإجمالي</th><th>الصافي</th></tr></thead><tbody id="rows"><tr><td colspan="6">لا توجد بيانات حتى الآن.</td></tr></tbody></table></div></main></div><script type="module">import {db} from './firebase.js';import {collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';let data=[],filtered=[];const month=document.getElementById('month'),dep=document.getElementById('department'),doctor=document.getElementById('doctor');const isTarget=e=>String(e.type||'').trim()==='إيراد';function money(v){return Number(v||0).toLocaleString('ar-SA',{maximumFractionDigits:2})+' ر.س'}function rebuildFilters(){const currentM=month.value,currentD=dep.value,currentDoc=doctor.value;const months=[...new Set(data.map(x=>String(x.date||'').slice(0,7)).filter(Boolean))].sort().reverse();month.innerHTML='<option value="">كل الأشهر</option>'+months.map(x=>'<option value="'+x+'">'+x+'</option>').join('');month.value=months.includes(currentM)?currentM:'';dep.innerHTML='<option value="">كل الأقسام</option>'+[...new Set(data.map(x=>x.department).filter(Boolean))].sort().map(x=>'<option>'+x+'</option>').join('');dep.value=[...dep.options].some(o=>o.value===currentD)?currentD:'';rebuildDoctors(currentDoc)}function rebuildDoctors(selected=''){const d=dep.value;const docs=[...new Set(data.filter(x=>!d||x.department===d).map(x=>x.doctor).filter(Boolean))].sort();doctor.innerHTML='<option value="">كل الأطباء</option>'+docs.map(x=>'<option>'+x+'</option>').join('');if(docs.includes(selected))doctor.value=selected}function apply(){filtered=data.filter(x=>(!month.value||String(x.date||'').startsWith(month.value))&&(!dep.value||x.department===dep.value)&&(!doctor.value||x.doctor===doctor.value));rows.innerHTML=filtered.length?filtered.map(x=>'<tr><td>'+(x.date||'')+'</td><td>'+(x.department||'')+'</td><td>'+(x.doctor||'')+'</td><td>'+(x.patients||0)+'</td><td>'+money(x.gross)+'</td><td>'+money(x.net??x.gross)+'</td></tr>').join(''):'<tr><td colspan="6">لا توجد بيانات مطابقة.</td></tr>';totalGross.textContent=money(filtered.reduce((s,x)=>s+Number(x.gross||0),0));totalNet.textContent=money(filtered.reduce((s,x)=>s+Number(x.net??x.gross??0),0));count.textContent=filtered.length}async function load(){try{const s=await getDocs(collection(db,'entries'));data=s.docs.map(x=>({id:x.id,...x.data()})).filter(isTarget);rebuildFilters();apply();status.textContent='● متصل ومحدّث الآن';}catch(e){console.error(e);status.textContent='تعذر قراءة Firebase';}}dep.addEventListener('change',()=>{rebuildDoctors();apply()});month.addEventListener('change',apply);doctor.addEventListener('change',apply);exportBtn.addEventListener('click',()=>{if(!filtered.length)return alert('لا توجد بيانات للتصدير');if(typeof XLSX==='undefined')return alert('تعذر تحميل أداة Excel. تحقق من الاتصال ثم حاول مرة أخرى.');const h=["التاريخ","القسم","الطبيب","عدد المرضى","الإجمالي","الصافي"];const body=filtered.map(x=>[x.date||'',x.department||'',x.doctor||'',Number(x.patients||0),Number(x.gross||0),Number(x.net??x.gross??0)]);const ws=XLSX.utils.aoa_to_sheet([['مجمع الدكتور مهند الطبي العام - الإيرادات'],['تاريخ التصدير',new Date().toLocaleDateString('en-GB')],[],h,...body]);ws['!merges']=[XLSX.utils.decode_range('A1:F1')];ws['!cols']=[{wch:14},{wch:22},{wch:22},{wch:14},{wch:18},{wch:18}];ws['!views']=[{RTL:true}];ws['!autofilter']={ref:'A4:F'+(body.length+4)};const border={top:{style:'thin',color:{rgb:'D7E0E3'}},bottom:{style:'thin',color:{rgb:'D7E0E3'}},left:{style:'thin',color:{rgb:'D7E0E3'}},right:{style:'thin',color:{rgb:'D7E0E3'}}};for(let col=0;col<6;col++){let a=XLSX.utils.encode_cell({r:0,c:col});if(ws[a])ws[a].s={font:{bold:true,sz:16,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'17364A'}},alignment:{horizontal:'center'}};a=XLSX.utils.encode_cell({r:3,c:col});if(ws[a])ws[a].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'17364A'}},alignment:{horizontal:'center'},border}}for(let r=4;r<body.length+4;r++)for(let col=0;col<6;col++){const a=XLSX.utils.encode_cell({r,c:col});if(ws[a])ws[a].s={alignment:{horizontal:'center'},border,fill:{fgColor:{rgb:r%2===0?'F7FAFC':'FFFFFF'}}}}for(let r=5;r<=body.length+4;r++){if(ws['E'+r])ws['E'+r].z='#,##0.00 "ر.س"';if(ws['F'+r])ws['F'+r].z='#,##0.00 "ر.س"'}const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'الإيرادات');XLSX.writeFile(wb,'الإيرادات-'+new Date().toISOString().slice(0,10)+'.xlsx')});load();</script><script>function toggleGlobalMenu(force){const d=document.getElementById('globalDrawer'),o=document.getElementById('drawerOverlay');const open=typeof force==='boolean'?force:!d.classList.contains('open');d.classList.toggle('open',open);o.classList.toggle('show',open)}</script></body></html>
